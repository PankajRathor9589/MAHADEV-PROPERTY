services:
  - type: web
    name: sagar-infra-api
    env: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://your-frontend-domain.vercel.app
      - key: FRONTEND_URL
        value: https://your-frontend-domain.vercel.app
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_SECRET_KEY
        sync: false
      - key: ADMIN_SESSION_NAME
        value: Sagar Infra Admin
      - key: ADMIN_SESSION_EMAIL
        value: admin.session@sagarinfra.local
      - key: ADMIN_SESSION_PHONE
        value: 7692016188
      - key: MAX_FILE_SIZE_MB
        value: 5
